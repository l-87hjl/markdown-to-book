name: Public content checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/publication_preflight.py --tree HEAD
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.js
      - name: Check every proposed commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/publication_preflight.py --range "$BASE_SHA..HEAD"
